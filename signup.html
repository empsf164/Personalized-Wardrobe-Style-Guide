<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Style Account — EDIT / FORM</title>
  <meta name="description" content="Join EDIT / FORM to build your digital wardrobe, unlock personalized outfit recommendations, and create your style guide.">
  <meta property="og:title" content="Sign Up — EDIT / FORM">
  <meta property="og:description" content="Your personalized style journey starts here.">

  <!-- Core Stylesheets -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Theme Preload Script -->
  <script src="assets/js/theme.js"></script>
</head>
<body>

  <!-- Centered Editorial Auth Layout -->
  <main class="auth-wrapper">
    <div class="auth-form-container">
      <div class="auth-form-card">
        <!-- Brand Name in Top Center Inside Box -->
        <div class="auth-brand-header">
          <a href="index.html" class="brand-logo" aria-label="EDIT / FORM Home">
            EDIT <span class="divider">/</span> FORM
          </a>
        </div>

        <div class="auth-header">
          <span class="eyebrow">Create Account</span>
          <h1 style="font-size: 2.1rem; margin-bottom: 0.4rem;">Join EDIT / FORM</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">
            Begin your personal styling and wardrobe refinement experience.
          </p>
        </div>

        <form id="signup-form" data-ajax="mock" data-success-msg="Account created successfully! Welcome to EDIT / FORM.">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input type="text" class="form-control" id="signup-name" placeholder="Eleanor Vance" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <input type="email" class="form-control" id="signup-email" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Create Password</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="signup-password" placeholder="At least 8 characters" required />
              <button type="button" class="password-toggle-btn" aria-label="Show password">
                <svg class="icon-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="signup-confirm-password" placeholder="Confirm your password" required />
              <button type="button" class="password-toggle-btn" aria-label="Show password">
                <svg class="icon-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label" style="cursor: pointer;">
              <input type="checkbox" required />
              <span style="font-size: 0.82rem;">I agree to the <a href="about.html#terms" class="auth-link">Terms of Service</a> &amp; <a href="about.html#privacy" class="auth-link">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.8rem;">
            Create My Account →
          </button>
        </form>

        <!-- Social Icons: Google and Apple -->
        <div class="auth-divider">
          <span>or sign up with</span>
        </div>

        <div class="social-auth-grid">
          <button type="button" class="btn social-btn" aria-label="Sign up with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Google</span>
          </button>

          <button type="button" class="btn social-btn" aria-label="Sign up with Apple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.08 1.73-.95 2.76.99.08 2.05-.51 2.68-1.26z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
          Already have an account? <a href="login.html" class="auth-link" style="font-weight: 600;">Login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
