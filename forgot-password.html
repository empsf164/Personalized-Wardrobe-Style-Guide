<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EDIT / FORM</title>
  <meta name="description" content="Recover your EDIT / FORM styling account access.">
  <meta property="og:title" content="Reset Password — EDIT / FORM">

  <!-- Core Stylesheets -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Theme Preload Script -->
  <script src="assets/js/theme.js"></script>
</head>
<body>

  <!-- Centered Editorial Auth Layout -->
  <main class="auth-wrapper">
    <div class="auth-form-container">
      <div class="auth-form-card">
        <!-- Brand Name in Top Center Inside Box -->
        <div class="auth-brand-header">
          <a href="index.html" class="brand-logo" aria-label="EDIT / FORM Home">
            EDIT <span class="divider">/</span> FORM
          </a>
        </div>

        <div class="auth-header">
          <span class="eyebrow">Account Recovery</span>
          <h1 style="font-size: 2.1rem; margin-bottom: 0.5rem;">Reset Your Password</h1>
          <p style="color: var(--text-muted); font-size: 0.92rem;">
            Enter the email associated with your style profile and we will send you instructions to reset your password.
          </p>
        </div>

        <form id="forgot-form" data-ajax="mock" data-success-msg="A reset link has been dispatched to your email address.">
          <div class="form-group">
            <label class="form-label" for="reset-email">Email Address</label>
            <input type="email" class="form-control" id="reset-email" placeholder="name@example.com" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
            Send Reset Link →
          </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
          Remembered your password? <a href="login.html" style="color: var(--accent-gold); font-weight: 600; text-decoration: underline;">Return to Login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
