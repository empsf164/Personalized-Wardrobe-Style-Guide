<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">

  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Theme Preload Script -->
  <script src="assets/js/theme.js"></script>
</head>
<body>

  <!-- Mandatory Navbar -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">EDIT <span class="divider">/</span> FORM</a>
      <a href="index.html" class="btn btn-sm btn-secondary">Return Home</a>
    </div>
  </header>

  <main class="section flex-center" style="min-height: calc(100vh - 160px); text-align: center;">
    <div class="container container-narrow">
      <div class="card card-glass" style="padding: clamp(2.5rem, 6vw, 4.5rem);">
        <span class="eyebrow" style="color: var(--accent-gold);">Private Studio Service</span>
        <h1 style="font-size: clamp(2.4rem, 4.5vw, 3.8rem); margin-bottom: 1.2rem;">

        </p>

        <form id="waitlist-form" data-ajax="mock" data-success-msg="Thank you! You have been added to our VIP Stylist priority list." style="max-width: 480px; margin: 0 auto;">
          <div class="flex gap-xs" style="flex-wrap: wrap;">
            <input type="email" class="form-control" placeholder="Enter your email for private invite" required style="flex: 1; min-width: 220px;" />
            <button type="submit" class="btn btn-primary">Join Priority List</button>
          </div>
        </form>

        <div style="margin-top: 2.5rem;">
          <a href="wardrobe.html" class="btn btn-ghost btn-sm">Explore Digital Wardrobe Meanwhile →</a>

  <script src="assets/js/main.js"></script>
